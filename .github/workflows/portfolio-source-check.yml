name: Portfolio source verification
on:
  push:
    branches: [docs/portfolio-professionalization-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: "SchoolManagementApp"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npx expo config --json > /tmp/portfolio-expo-config.json && test -s /tmp/portfolio-expo-config.json
